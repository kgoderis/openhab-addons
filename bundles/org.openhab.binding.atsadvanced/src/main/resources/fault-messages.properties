flag.AREV_PARTSET=Part set
flag.AREV_PARTSET2=Part set 2
flag.AREV_UNSET=Unset
flag.AREV_ALARM=Alarm
flag.AREV_EXIT=Exit timer running
flag.AREV_ENTRY=Entry timer running

